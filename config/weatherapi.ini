# ASL3 Saytime Weather configuration
# Works on AllStarLink 3 systems running Debian 12 Bookworm or Debian 13 Trixie.

# WeatherAPI.com key
API_KEY="PUT_YOUR_WEATHERAPI_KEY_HERE"

# Weather location can be a ZIP code, city, airport, or ICAO-style airport code.
# Examples: 74437, Henryetta OK, KTUL, Tulsa International Airport
LOCATION="74437"

# Your AllStarLink node number
NODE="YOUR_NODE_NUMBER"

# TIME_FORMAT can be 12 or 24
TIME_FORMAT="12"

# Temperature unit: F or C
TEMP_UNIT="F"

# Announce feels-like temperature if present: yes or no
ANNOUNCE_FEELS_LIKE="no"

# Announce humidity if present: yes or no
ANNOUNCE_HUMIDITY="no"

# Weather cache location used by the WeatherAPI.com update service/timer
CACHE_DIR="/var/cache/asl3-saytime-weather"

# Recorded voice files location, matching the previous KD5FMU repos
SOUNDS_DIR="/usr/local/share/asterisk/sounds/custom"
